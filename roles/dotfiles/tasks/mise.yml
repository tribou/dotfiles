---
- name: Install mise version manager
  ansible.builtin.shell:
    cmd: curl -fsSL https://mise.run | MISE_INSTALL_PATH="{{ dotfiles_home }}/.local/bin/mise" sh
    creates: "{{ dotfiles_home }}/.local/bin/mise"
  environment:
    MISE_DATA_DIR: "{{ dotfiles_home }}/.local/share/mise"
    MISE_CACHE_DIR: "{{ dotfiles_home }}/.cache/mise"
  tags: [mise]

- name: Probe mise bootstrap packages support
  ansible.builtin.command:
    cmd: "{{ dotfiles_home }}/.local/bin/mise bootstrap packages --help"
  register: dotfiles_mise_bootstrap_probe
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [mise]

- name: Refresh mise when bootstrap packages are unavailable
  ansible.builtin.shell:
    cmd: curl -fsSL https://mise.run | MISE_INSTALL_PATH="{{ dotfiles_home }}/.local/bin/mise" sh
  when: dotfiles_mise_bootstrap_probe.rc != 0
  tags: [mise]

- name: Verify mise bootstrap packages support after refresh
  ansible.builtin.command:
    cmd: "{{ dotfiles_home }}/.local/bin/mise bootstrap packages --help"
  register: dotfiles_mise_bootstrap_verify
  changed_when: false
  failed_when: dotfiles_mise_bootstrap_verify.rc != 0
  check_mode: false
  tags: [mise]

- name: Ensure the Homebrew prefix exists for brew bootstrap packages
  ansible.builtin.command:
    cmd: "{{ dotfiles_repo_root }}/scripts/ensure_brew_prefix.sh"
  register: dotfiles_brew_prefix
  changed_when: "'Created Homebrew prefix' in dotfiles_brew_prefix.stdout"
  tags: [mise]

- name: Apply mise-managed host packages
  ansible.builtin.command:
    cmd: "{{ dotfiles_home }}/.local/bin/mise bootstrap packages apply --yes"
  environment: &mise_environment
    MISE_DATA_DIR: "{{ dotfiles_home }}/.local/share/mise"
    MISE_CACHE_DIR: "{{ dotfiles_home }}/.cache/mise"
    PATH: "{{ (ansible_facts.system == 'Darwin') | ternary('/opt/homebrew/bin', '/home/linuxbrew/.linuxbrew/bin') }}:{{ dotfiles_home }}/.local/bin:{{ ansible_facts.env.PATH }}"
  register: dotfiles_mise_packages
  changed_when: >-
    'Installing' in dotfiles_mise_packages.stdout
    or 'Installing' in dotfiles_mise_packages.stderr
  tags: [mise]

- name: Install mise-managed tools
  ansible.builtin.command:
    cmd: "{{ dotfiles_home }}/.local/bin/mise install --yes"
  environment: *mise_environment
  register: dotfiles_mise_tools_install
  # Installing tools emits lines such as "mise ansible@14.4.0 [1/3] install";
  # clean runs emit "mise all tools are installed" or no output.
  changed_when: >-
    dotfiles_mise_tools_install.stdout is search('\\[[0-9]+/[0-9]+\\] install')
    or dotfiles_mise_tools_install.stderr is search('\\[[0-9]+/[0-9]+\\] install')
  tags: [mise]

# python's postinstall only runs when mise installs that python, so an
# already-present python would never get pynvim.
- name: Ensure pynvim in the mise Python
  ansible.builtin.command:
    cmd: "{{ dotfiles_home }}/.local/bin/mise exec -- python -m pip install pynvim"
  environment: *mise_environment
  register: dotfiles_pynvim_install
  changed_when: "'Successfully installed' in dotfiles_pynvim_install.stdout"
  tags: [mise]

- name: Verify mise-managed packages and tools
  ansible.builtin.command:
    cmd: "{{ dotfiles_repo_root }}/scripts/verify_mise_tools.sh"
  environment:
    MISE_BIN: "{{ dotfiles_home }}/.local/bin/mise"
    MISE_DATA_DIR: "{{ dotfiles_home }}/.local/share/mise"
    MISE_CACHE_DIR: "{{ dotfiles_home }}/.cache/mise"
  changed_when: false
  tags: [mise]

# Node 25+ no longer bundles corepack; npm:corepack (mise-config.toml) provides
# it. `corepack enable` links yarn/pnpm next to it and `mise reshim` exposes
# them as shims. Check the shims each run instead of a one-time marker, so a
# node major bump that drops them is repaired.
- name: Check corepack yarn and pnpm shims
  ansible.builtin.shell:
    cmd: |
      "{{ dotfiles_home }}/.local/bin/mise" which yarn && "{{ dotfiles_home }}/.local/bin/mise" which pnpm
  environment: *mise_environment
  register: dotfiles_corepack_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags: [mise]

- name: Enable corepack yarn and pnpm shims
  ansible.builtin.shell:
    cmd: |
      "{{ dotfiles_home }}/.local/bin/mise" exec -- corepack enable
      "{{ dotfiles_home }}/.local/bin/mise" reshim
  environment: *mise_environment
  when: dotfiles_corepack_check.rc != 0
  tags: [mise]
