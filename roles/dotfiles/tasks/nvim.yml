---
- name: Install vim-plug
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/junegunn/vim-plug/master/plug.vim
    dest: "{{ dotfiles_home }}/.local/share/nvim/site/autoload/plug.vim"
    mode: "0644"

- name: Install Neovim plugins headlessly
  ansible.builtin.command:
    cmd: nvim --headless "+PlugInstall --sync" +qall
    creates: "{{ dotfiles_home }}/.local/share/nvim/plugged"

- name: Install CoC extensions headlessly
  # :CocInstall requires explicit extension names — it won't read
  # g:coc_global_extensions itself (that list only auto-installs
  # asynchronously after CoC's own init, too late for a headless run to
  # wait on) — so pull the names from g:coc_global_extensions here instead.
  ansible.builtin.command:
    cmd: nvim --headless -c "execute 'CocInstall -sync ' . join(g:coc_global_extensions)" -c "qall"
    creates: "{{ dotfiles_home }}/.config/coc/extensions/node_modules"

- name: Check if gopls is installed
  ansible.builtin.command: which gopls
  register: dotfiles_gopls_check
  changed_when: false
  failed_when: false
  check_mode: false
  environment:
    PATH: "{{ dotfiles_home }}/dev/go/bin:{{ dotfiles_home }}/go/bin:{{ dotfiles_home }}/.local/share/mise/shims:{{ ansible_facts.env.PATH }}"

- name: Install gopls (Go language server)
  ansible.builtin.command:
    cmd: "go install golang.org/x/tools/gopls@latest"
  when: dotfiles_gopls_check.rc != 0
  environment:
    GOPATH: "{{ dotfiles_home }}/dev/go"
    PATH: "{{ dotfiles_home }}/dev/go/bin:{{ dotfiles_home }}/go/bin:{{ dotfiles_home }}/.local/share/mise/shims:{{ ansible_facts.env.PATH }}"
