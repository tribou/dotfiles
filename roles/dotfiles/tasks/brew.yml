---
- name: Detect Homebrew on macOS
  ansible.builtin.command: command -v brew
  register: dotfiles_brew_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: ansible_facts.system == 'Darwin'

- name: Install Homebrew on macOS
  ansible.builtin.shell:
    cmd: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
  environment:
    NONINTERACTIVE: "1"
  when:
    - ansible_facts.system == 'Darwin'
    - dotfiles_brew_check.rc != 0

- name: Re-detect Homebrew after install
  # The installer does not update the current process PATH, so inspect the
  # supported install locations directly.
  ansible.builtin.shell:
    cmd: |
      for candidate in /opt/homebrew/bin/brew /usr/local/bin/brew; do
        if [ -x "$candidate" ]; then
          printf '%s\n' "$candidate"
          exit 0
        fi
      done
      exit 1
  register: dotfiles_brew_which
  changed_when: false
  check_mode: false
  when:
    - ansible_facts.system == 'Darwin'
    - dotfiles_brew_check.rc != 0

- name: Set brew binary fact
  ansible.builtin.set_fact:
    dotfiles_brew_bin: >-
      {{ dotfiles_brew_check.stdout | trim if dotfiles_brew_check.rc == 0
         else dotfiles_brew_which.stdout | trim }}
  when: ansible_facts.system == 'Darwin'
