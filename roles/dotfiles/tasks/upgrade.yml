---
- name: Upgrade apt packages (Debian/Ubuntu)
  ansible.builtin.apt:
    upgrade: true
    update_cache: true
  become: true
  when: ansible_facts.os_family == 'Debian'

- name: Upgrade pacman packages (Arch)
  community.general.pacman:
    upgrade: true
    update_cache: true
  become: true
  when: ansible_facts.os_family == 'Archlinux'

- name: Upgrade mise-managed host packages
  ansible.builtin.command:
    cmd: "{{ dotfiles_home }}/.local/bin/mise bootstrap packages upgrade"
  register: dotfiles_mise_package_upgrade
  changed_when: "'Upgrading' in dotfiles_mise_package_upgrade.stdout"
  tags: [upgrade]

- name: Upgrade mise-managed tools
  ansible.builtin.command:
    cmd: "{{ dotfiles_home }}/.local/bin/mise upgrade --yes"
  register: dotfiles_mise_tool_upgrade
  changed_when: "'Installing' in dotfiles_mise_tool_upgrade.stdout or 'Updating' in dotfiles_mise_tool_upgrade.stdout"
  tags: [upgrade]

- name: Upgrade retained macOS Homebrew casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: latest
    accept_external_apps: true
    path: "{{ (dotfiles_brew_bin | default('brew')) | dirname }}"
  loop: "{{ dotfiles_brew_macos_casks }}"
  register: dotfiles_brew_cask_upgrade
  failed_when: false
  when: ansible_facts.system == 'Darwin'

- name: Stat global Brewfile for upgrade
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.Brewfile"
  register: brewfile_stat
  when: ansible_facts.system == 'Darwin'

- name: Upgrade global Brewfile casks
  ansible.builtin.command:
    cmd: "{{ dotfiles_brew_bin | default('brew') }} bundle --global --upgrade"
  register: dotfiles_brewfile_upgrade
  changed_when: false
  failed_when: false
  when:
    - ansible_facts.system == 'Darwin'
    - brewfile_stat.stat.exists

- name: Collect Homebrew problems needing manual remediation
  ansible.builtin.set_fact:
    brew_manual_problems: >-
      {% set cask_failures = (dotfiles_brew_cask_upgrade.results | default([])
          | selectattr('failed', 'defined') | selectattr('failed', 'equalto', true)
          | list) %}
      {% set cask_rc_failures = (dotfiles_brew_cask_upgrade.results | default([])
          | rejectattr('failed', 'equalto', true)
          | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0)
          | list) %}
      {{ cask_failures + cask_rc_failures
         + ([dotfiles_brewfile_upgrade] if (dotfiles_brewfile_upgrade is defined and (dotfiles_brewfile_upgrade.rc | default(0) | int) != 0) else []) }}
  changed_when: false

- name: Surface Homebrew problems needing manual remediation
  ansible.builtin.debug:
    msg: |
      WARNING: Homebrew cask upgrades finished with issues that need manual remediation:
      {% for problem in brew_manual_problems %}
      - {{ problem.item | default('global Brewfile') }}: {{ (problem.stderr | default('') | trim) or (problem.msg | default('unknown error') | trim) }}
      {% endfor %}
  when: brew_manual_problems | length > 0

- name: Update rustup and toolchains
  ansible.builtin.shell:
    cmd: "rustup self update && rustup update"
    executable: /bin/bash
  environment:
    CARGO_HOME: "{{ dotfiles_home }}/.cargo"
    RUSTUP_HOME: "{{ dotfiles_home }}/.rustup"
    PATH: "{{ dotfiles_home }}/.cargo/bin:{{ ansible_facts.env.PATH }}"
  register: rustup_update
  changed_when: "'unchanged' not in (rustup_update.stdout | default(''))"

- name: Update Neovim plugins
  ansible.builtin.command:
    cmd: nvim --headless "+PlugUpdate --sync" +qall
  changed_when: true

- name: Update tmux plugins via TPM
  ansible.builtin.shell:
    cmd: >
      tmux new-session -d -s _upgrade_tpm;
      tmux set-environment -t _upgrade_tpm -g TMUX_PLUGIN_MANAGER_PATH "{{ dotfiles_home }}/.tmux/plugins/";
      "{{ dotfiles_home }}/.tmux/plugins/tpm/bin/update_plugins" all;
      tmux kill-session -t _upgrade_tpm 2>/dev/null || true
    executable: /bin/bash
  changed_when: true

- name: Pull latest beads issues
  ansible.builtin.command:
    cmd: "bd -C {{ dotfiles_repo_root }} dolt pull"
  register: beads_pull
  changed_when: "'Everything up-to-date' not in (beads_pull.stdout | default(''))"
  failed_when: false
  when: bd_bin.rc == 0
