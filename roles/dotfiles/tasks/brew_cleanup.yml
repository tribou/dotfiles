---
- name: Probe installed Homebrew for legacy cleanup
  ansible.builtin.shell:
    cmd: |
      for candidate in "$(command -v brew 2>/dev/null || true)" /opt/homebrew/bin/brew /home/linuxbrew/.linuxbrew/bin/brew /usr/local/bin/brew; do
        if [ -n "$candidate" ] && [ -x "$candidate" ]; then
          printf '%s\n' "$candidate"
          exit 0
        fi
      done
      exit 1
  register: dotfiles_brew_cleanup_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set cleanup Homebrew executable
  ansible.builtin.set_fact:
    dotfiles_brew_cleanup_bin: "{{ dotfiles_brew_cleanup_probe.stdout | trim }}"
  when: dotfiles_brew_cleanup_probe.rc == 0

# One brew invocation for the whole inventory; per-formula `brew list` calls
# cost ~1s each on every converge long after the migration is done.
- name: List installed Homebrew formulae
  ansible.builtin.command:
    cmd: "{{ dotfiles_brew_cleanup_bin }} list --formula -1"
  register: dotfiles_brew_cleanup_installed
  changed_when: false
  check_mode: false
  when: dotfiles_brew_cleanup_bin | default('') | length > 0

- name: Select legacy Homebrew formulae still installed
  ansible.builtin.set_fact:
    # Keep this migration list local to cleanup; it is not desired-state
    # inventory. `brew list -1` prints the versioned python@3.x formula that
    # the `python` alias resolves to, so match it by prefix.
    dotfiles_brew_cleanup_targets: >-
      {{ ['neovim', 'python', 'jq', 'fd', 'ripgrep', 'bat', 'shellcheck',
          'lazydocker', 'lazygit', 'just', 'tree-sitter-cli', 'fzf', 'git-delta',
          'gh', 'glow', 'zoxide', 'tmux']
         | intersect(dotfiles_brew_cleanup_installed.stdout_lines | default([]))
         + (dotfiles_brew_cleanup_installed.stdout_lines | default([])
            | select('match', '^python@3') | list) }}

# Never uninstall the Homebrew copies unless the mise replacements are present,
# including when this file runs alone via `--tags brew_cleanup`.
- name: Verify mise replacements before legacy Homebrew cleanup
  ansible.builtin.command:
    cmd: "{{ dotfiles_repo_root }}/scripts/verify_mise_tools.sh"
  environment:
    MISE_BIN: "{{ dotfiles_home }}/.local/bin/mise"
    MISE_DATA_DIR: "{{ dotfiles_home }}/.local/share/mise"
    MISE_CACHE_DIR: "{{ dotfiles_home }}/.cache/mise"
  changed_when: false
  check_mode: false
  when: dotfiles_brew_cleanup_targets | length > 0

- name: Remove installed legacy Homebrew formula
  ansible.builtin.command:
    cmd: "{{ dotfiles_brew_cleanup_bin }} uninstall --formula {{ item }}"
  loop: "{{ dotfiles_brew_cleanup_targets }}"
  register: dotfiles_brew_cleanup_uninstalls
  changed_when: dotfiles_brew_cleanup_uninstalls.rc == 0
  failed_when: false

- name: Collect legacy Homebrew cleanup failures
  ansible.builtin.set_fact:
    dotfiles_brew_cleanup_failures: >-
      {{ dotfiles_brew_cleanup_uninstalls.results | default([])
         | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list }}
  changed_when: false

- name: Warn about legacy Homebrew cleanup failures
  ansible.builtin.debug:
    msg: |
      WARNING: Homebrew cleanup could not remove these legacy formulae:
      {% for failure in dotfiles_brew_cleanup_failures %}
      - {{ failure.item }}: {{ failure.stderr | default('unknown error') | trim }}
      {% endfor %}
  when: dotfiles_brew_cleanup_failures | length > 0
