---
- name: Install macOS-only Homebrew casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    accept_external_apps: true
    path: "{{ (dotfiles_brew_bin | default('brew')) | dirname }}"
  loop: "{{ dotfiles_brew_macos_casks }}"
  when: ansible_facts.system == 'Darwin'
  ignore_errors: true

# `brew bundle --global` reads ~/.Brewfile (created by copying
# Brewfile.optional.example). This retained flow is macOS cask-only.
- name: Stat global Brewfile
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.Brewfile"
  register: brewfile_stat
  when: ansible_facts.system == 'Darwin'

- name: Apply global Brewfile casks
  ansible.builtin.command:
    cmd: "{{ dotfiles_brew_bin }} bundle --global --no-upgrade"
  when:
    - ansible_facts.system == 'Darwin'
    - brewfile_stat.stat.exists
