---
- name: Install macOS-only Homebrew formulae
  community.general.homebrew:
    name: "{{ dotfiles_brew_macos_formulae }}"
    state: present
  when: ansible_facts.system == 'Darwin'

- name: Install macOS-only Homebrew casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    accept_external_apps: true
  loop: "{{ dotfiles_brew_macos_casks }}"
  when: ansible_facts.system == 'Darwin'
  ignore_errors: true

# `brew bundle --global` reads ~/.Brewfile (created by copying
# Brewfile.optional.example). Cask directives are macOS-only and are skipped
# automatically on Linux; formulae apply on every platform, so this must NOT
# be Darwin-gated. Missing file is skipped silently via brewfile_stat.
- name: Stat global Brewfile
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.Brewfile"
  register: brewfile_stat

- name: Apply global Brewfile (install missing opt-in casks/formulae)
  ansible.builtin.command:
    cmd: brew bundle --global --no-upgrade
  when:
    - brewfile_stat.stat.exists

- name: Upgrade global Brewfile packages (opt-in casks/formulae)
  ansible.builtin.command:
    cmd: brew bundle --global --upgrade
  when:
    - brewfile_stat.stat.exists
    - dotfiles_state == 'latest'
