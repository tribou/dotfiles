name: macos-dotfiles-tests

# Run this workflow every time a new commit pushed to your repository
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run bash function tests
    runs-on: macos-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Install and verify mise packages and tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # rust is slow to install and no test uses it
          MISE_DISABLE_TOOLS: rust
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.config/mise"
          curl -fsSL https://mise.run | MISE_INSTALL_PATH="$HOME/.local/bin/mise" sh
          ln -sfn "$GITHUB_WORKSPACE/mise-config.toml" "$HOME/.config/mise/config.toml"
          "$HOME/.local/bin/mise" bootstrap packages apply --yes
          "$HOME/.local/bin/mise" install --yes
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          MISE_BIN="$HOME/.local/bin/mise" ./scripts/verify_mise_tools.sh

      - name: Dry-run the full mise bootstrap on macOS
        shell: bash
        env:
          MISE_DISABLE_TOOLS: rust
        run: |
          set -euo pipefail
          "$HOME/.local/bin/mise" trust "$GITHUB_WORKSPACE/mise.toml"
          "$HOME/.local/bin/mise" -C "$GITHUB_WORKSPACE" bootstrap --dry-run

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install shellcheck and GNU parallel
        run: brew install shellcheck parallel

      - name: Run bash function tests
        run: just test-unit
