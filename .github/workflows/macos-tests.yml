name: macos-dotfiles-tests

# Run this workflow every time a new commit pushed to your repository
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run bash function tests
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Require Apple Silicon runner
        run: test "$(uname -m)" = arm64

      # The documented preview command, before mise or its config exists, so
      # bootstrap.sh installs mise itself. The runner image still ships
      # Homebrew, git and Xcode, so this is not a stock macOS machine.
      - name: Dry-run the full mise bootstrap on macOS
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MISE_DISABLE_TOOLS: rust
        run: ./bootstrap.sh --dry-run

      - name: Install and verify mise packages and tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # rust is slow to install and no test uses it
          MISE_DISABLE_TOOLS: rust
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin" "$HOME/.config/mise"
          curl -fsSL https://mise.run | MISE_INSTALL_PATH="$HOME/.local/bin/mise" sh
          ln -sfn "$GITHUB_WORKSPACE/mise-config.toml" "$HOME/.config/mise/config.toml"
          "$HOME/.local/bin/mise" bootstrap packages apply --yes
          "$HOME/.local/bin/mise" install --yes
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
          MISE_BIN="$HOME/.local/bin/mise" ./scripts/verify_mise_tools.sh

      # just and shellcheck come from mise [tools] via the shims added above.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install GNU parallel
        run: brew install parallel

      - name: Run bash function tests
        run: just test-unit
