min_version = "2026.11.7"

[tools]
node = "lts"
ruby = "4"
python = { version = "latest", postinstall = "python -m pip install --upgrade pynvim" }
go = "latest"
"go:golang.org/x/tools/gopls" = "latest"
rust = "stable"
bun = "latest"
tombi = "latest"
neovim = "latest"
jq = "latest"
fd = "latest"
ripgrep = "latest"
bat = "latest"
shellcheck = "latest"
lazydocker = "latest"
lazygit = "latest"
just = "latest"
tree-sitter = "latest"
fzf = "latest"
delta = "latest"
gh = "latest"
glow = "latest"
zoxide = "latest"
tmux = "latest"
herdr = "latest"
opencode = "latest"
aws-cli = "latest"
"npm:corepack" = "latest"
"npm:eas-cli" = "latest"
"npm:eslint_d" = "latest"
"npm:editorconfig" = "latest"
"npm:intelephense" = "latest"
"npm:js-yaml" = "latest"
"npm:jsonlint" = "latest"
"npm:neovim" = "latest"
"npm:prettier" = "latest"
"npm:react-devtools" = "latest"
"npm:nodemon" = "latest"
"npm:typescript" = "latest"
"npm:bash-language-server" = "latest"
"npm:vue-language-server" = "latest"
"gem:neovim" = "latest"
"gem:solargraph" = "latest"

[bootstrap.packages]
# OS prerequisites. Entries for a manager this machine lacks are skipped, so
# apt: applies on Debian/Ubuntu and pacman: on Arch. os = "linux" keeps macOS
# from listing them as skipped follow-ups at the end of every bootstrap.
"apt:curl" = { version = "latest", os = "linux" }
"apt:git" = { version = "latest", os = "linux" }
"apt:build-essential" = { version = "latest", os = "linux" }
"apt:zlib1g-dev" = { version = "latest", os = "linux" }
"apt:xdg-utils" = { version = "latest", os = "linux" }
"apt:bash-completion" = { version = "latest", os = "linux" }
"apt:openssh-client" = { version = "latest", os = "linux" }
"pacman:curl" = { version = "latest", os = "linux" }
"pacman:git" = { version = "latest", os = "linux" }
"pacman:base-devel" = { version = "latest", os = "linux" }
"pacman:zlib" = { version = "latest", os = "linux" }
"pacman:xdg-utils" = { version = "latest", os = "linux" }
"pacman:bash-completion" = { version = "latest", os = "linux" }
"pacman:openssh" = { version = "latest", os = "linux" }
# Formulae, poured by mise into the standard Homebrew prefix (no Homebrew needed).
"brew:bash" = "latest"
"brew:git" = "latest"
"brew:zlib" = "latest"
"brew:htop" = "latest"
"brew:gnupg" = "latest"
"brew:editorconfig" = "latest"
"brew:watchman" = "latest"
"brew:ssh-copy-id" = "latest"
"brew:git-extras" = "latest"
"brew:lynx" = "latest"
"brew:gcc" = { version = "latest", os = "linux" }
"brew:bash-completion" = { version = "latest", os = "macos/arm64" }
"brew:reattach-to-user-namespace" = { version = "latest", os = "macos/arm64" }
"brew:tmux-mem-cpu-load" = { version = "latest", os = "macos/arm64" }
# Terminal (config: ghostty/). adopt takes over an identical Ghostty.app that
# is already in /Applications instead of replacing it, which would reset its
# Accessibility grant (needed by the global quick-terminal keybind).
"brew-cask:ghostty" = { version = "latest", os = "macos", adopt = true }
# The font ghostty/config.ghostty (and init.vim's guifont) asks for. Without it
# Ghostty falls back to its built-in JetBrains Mono, with taller rows.
"brew-cask:font-hack-nerd-font" = { version = "latest", os = "macos" }
# Docker on macOS (its docker CLI appears once OrbStack.app has been opened).
# Linux gets Docker CE from scripts/bootstrap/converge.sh's step_docker.
"brew-cask:orbstack" = { version = "latest", os = "macos" }
# Launcher. adopt takes over an existing Raycast.app instead of replacing it,
# which would reset its Accessibility grant (needed for window management).
"brew-cask:raycast" = { version = "latest", os = "macos", adopt = true }

[env]
# hook-env rebuilds PATH as tool dirs + the PATH saved at activation on every
# prompt/cd, undoing any bash_profile prepend. _.path is placed ahead of tool
# dirs, so ~/.local/bin wrappers (e.g. sandbox-agent's opencode shim) win.
_.path = ["{{env.HOME}}/.local/bin"]

[settings]
legacy_version_file = true
ruby.compile = false

[settings.npm]
package_manager = "npm"

[shell_alias]
coi = "co $INTEGRATION_BRANCH"
mi = "merge $INTEGRATION_BRANCH"
fa = "fem; fed; fei"
fei = "f origin $INTEGRATION_BRANCH:$INTEGRATION_BRANCH"
